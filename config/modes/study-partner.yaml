id: study-partner
label: Study partner
prompt_fragment: prompts/modes/study-partner.md
scope:
  read: ['**']
  write: ['sessions/**']
  # §5.5: material flagged as containing solutions is out of reach here. Retrievable by
  # `review`, which is looking back over the record rather than working through a problem.
  deny: ['ingest/solutions/**']
tools: [retrieve, mark, footnote, session_end]
session_template: templates/study-partner-session.md
capabilities:
  fs_read: ['<archive>/**']
  fs_write: ['sessions/**']
  execute: false
  model_call: { budget_usd_session: 1.00 }
  web_fetch: false
