# Mode manifest (§3). A mode is a config file, not code — adding one is a commit.
#
# `tools` lists only what step 1 implements. `retrieve` belongs here and lands with
# structural retrieval (step 2); the loader rejects it today rather than accepting a
# declaration it would silently ignore.
id: tutor
label: Tutor
prompt_fragment: prompts/modes/tutor.md
scope:
  read: ['**']
  write: ['sessions/**']
tools: [footnote, session_end]
session_template: templates/tutor-session.md
