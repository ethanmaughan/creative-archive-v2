# Mode manifest (§3). A mode is a config file, not code — adding one is a commit.
#
# `tools` lists only what the core implements. The loader rejects anything it cannot
# honour yet rather than accepting a declaration it would silently ignore.
id: tutor
label: Tutor
prompt_fragment: prompts/modes/tutor.md
scope:
  read: ['**']
  write: ['sessions/**']
  # §5.5: material flagged as containing solutions is out of reach here. Retrievable by
  # `review`, which is looking back over the record rather than working through a problem.
  deny: ['ingest/solutions/**']
tools: [retrieve, mark, footnote, session_end]
session_template: templates/tutor-session.md
capabilities:
  fs_read: ['<archive>/**']
  fs_write: ['sessions/**']
  execute: false
  model_call: { budget_usd_session: 1.00 }
  web_fetch: false
